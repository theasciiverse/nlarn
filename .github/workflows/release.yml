# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds NLarn's terminal edition for the Asciiverse catalog: one archive
# per target, named nlarn-<target>.tar.gz, plus a SHA256SUMS file, attached
# to a GitHub release (hub/catalog/SCHEMA.md, release.source = "github"),
# and .deb, .rpm, .apk and Arch packages from the Linux binaries (nfpm,
# asciiverse/nfpm.yaml). Runs on a v*-av.* tag, or by hand for an existing
# tag. Replaces upstream's build.yml, which runs on every tag created and
# publishes its own builds to the release.
#
# Linux builds run in Alpine and link glib, ncurses and zlib statically
# (-musl triples). macOS builds against Homebrew's glib and ncurses and
# bundles their dylibs beside the binary with dylibbundler (as upstream's
# macOS build does); a macOS failure does not hold back the release.
# No Windows build: NLarn on Windows needs the SDL window, not a terminal.

name: release

on:
  push:
    tags: ["v*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base pkgconf git glib-dev glib-static ncurses-dev ncurses-static \
              zlib-dev zlib-static gettext gettext-dev gettext-static pcre2-dev pcre2-static libffi-dev &&
            STATIC=1 asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }} &&
            chown -R '"$(id -u):$(id -g)"' .'
          file out/nlarn

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH=${{ matrix.arch }}
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build and package
        run: |
          brew install glib ncurses gettext pkg-config dylibbundler
          export PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export PATH="$(brew --prefix gettext)/bin:$PATH"
          asciiverse/build.sh
          dylibbundler -od -b -x out/nlarn -d out/libs -p @executable_path/libs/
          otool -L out/nlarn
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "NLarn $TAG" \
                 --notes "NLarn ${TAG%%-av.*} from github.com/nlarn/nlarn (Joachim de Groot), terminal edition, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
